name: update-jra

on:
  schedule:
    - cron: '20 18 * * *'   # JST 03:20
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch this month and next month JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/jra

          YM_THIS=$(date -u -d "+9 hours" +%Y%m)
          YM_NEXT=$(date -u -d "+9 hours +1 month" +%Y%m)

          echo "YM_THIS=$YM_THIS"
          echo "YM_NEXT=$YM_NEXT"

          curl -fsSL "https://www.jra.go.jp/keiba/common/calendar/json/${YM_THIS}.json" -o "data/jra/${YM_THIS}.json"
          curl -fsSL "https://www.jra.go.jp/keiba/common/calendar/json/${YM_NEXT}.json" -o "data/jra/${YM_NEXT}.json"

      - name: Commit & Push
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/jra/*.json
            git commit -m "update JRA JSON"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Trigger Pages deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'static.yml',
              ref: 'main'
            });